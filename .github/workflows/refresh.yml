# Scheduled refresh: USAJOBS -> clean bundle -> private Hugging Face dataset,
# then, only when the data changed, rebuild the public site from that bundle.
#
# Security (this repo is public):
# - Secrets live in the "production" environment, which only the main branch
#   can use. They are passed to the one step that needs them, never to tests.
# - Triggers are the schedule and the manual button only; never pull requests.
# - Read-only token for the repo; actions pinned to full commit SHAs.
# - Nothing from data/ is uploaded or cached: raw pages contain HR contacts.
#   The only cache is the public embedding model.
# - The site generator (private repo) is read with a read-only deploy key and
#   built with no secrets in its environment; only the final push step gets the
#   write deploy key for the Pages repo, and that key can only push to it.
name: refresh

on:
  # The main clock is an external trigger (workflow_dispatch every 15 min).
  # GitHub's cron is best-effort and drops most slots, so it's only a fallback.
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      PYTHONUNBUFFERED: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        # Every package must match a SHA-256 hash in the lock, and only prebuilt
        # wheels are allowed, so no package runs its own setup code at install.
        run: 'python -m pip install --require-hashes --only-binary :all: --no-deps -r requirements-dev.txt'

      - name: Test (no secrets)
        run: python -m pytest -q

      - name: Restore embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/models
          key: models-${{ hashFiles('usajobs_datapull/embedders.py') }}

      - name: Run pipeline
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_USER_AGENT: ${{ secrets.USAJOBS_USER_AGENT }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m usajobs_datapull all

      - name: Did the data change?
        id: data
        run: |
          python -c "import json; r = json.load(open('dist/publish.json')); print('published=' + ('true' if r['status'] == 'published' else 'false'))" >> "$GITHUB_OUTPUT"

      - name: Check out the site generator
        if: steps.data.outputs.published == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cresswellsec/usajobs-static-rag
          path: site
          ssh-key: ${{ secrets.SITE_REPO_DEPLOY_KEY }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.data.outputs.published == 'true'
        with:
          node-version: "24"

      - name: Build site (no secrets)
        if: steps.data.outputs.published == 'true'
        working-directory: site
        env:
          BUNDLE_DIR: ${{ github.workspace }}/dist/bundle
        # Lockfile-verified install with no install scripts; the bundle comes from
        # this run, so no Hugging Face token is needed.
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/fetch-bundle.mjs
          npm run check:bundle
          npm run build

      - name: Publish site
        if: steps.data.outputs.published == 'true'
        working-directory: site
        env:
          PAGES_REPO: cresswellsec/2210StaticSite
          PAGES_REMOTE: git@github.com:cresswellsec/2210StaticSite.git
          PAGES_DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          # GitHub's SSH host keys from its API (over HTTPS), not trust-on-first-use
          curl -fsSL https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > ~/.ssh/known_hosts
          key="$RUNNER_TEMP/pages_key"
          (umask 077; printf '%s\n' "$PAGES_DEPLOY_KEY" > "$key")
          trap 'rm -f "$key"' EXIT
          GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" node scripts/publish-pages.mjs
          echo "- site: rebuilt and pushed to GitHub Pages" >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: always()
        run: |
          python - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json, pathlib
          fetches = sorted(pathlib.Path("data/raw").glob("*/_fetch.json"))
          result = pathlib.Path("dist/publish.json")
          print("### Refresh")
          if fetches:
              f = json.loads(fetches[-1].read_text())
              print(f"- fetched {f['items']} postings in {f['requests']} request(s), snapshot {f['snapshot']}")
          else:
              print("- fetch did not complete")
          if result.exists():
              r = json.loads(result.read_text())
              print(f"- publish: **{r['status']}**, bundle `{r['bundle_id']}`")
          else:
              print("- publish did not run (an earlier stage failed)")
          EOF
